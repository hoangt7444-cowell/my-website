<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ping and Beacon Request Test</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1f2937;
            background: #f3f6f9;
        }

        body {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        main {
            padding: 28px;
            background: #ffffff;
            border: 1px solid #d9e1e8;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgb(31 41 55 / 8%);
        }

        h1 {
            margin-top: 0;
            color: #123b5d;
        }

        label,
        input,
        textarea,
        button {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        label {
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input,
        textarea {
            padding: 10px 12px;
            border: 1px solid #aebdca;
            border-radius: 4px;
            font: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 11px 14px;
            border: 0;
            border-radius: 4px;
            color: #ffffff;
            background: #1769aa;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:last-child {
            background: #b45309;
        }

        button:hover {
            filter: brightness(0.92);
        }

        .hint {
            color: #52606d;
            font-size: 0.95rem;
        }

        #log {
            min-height: 90px;
            margin-top: 20px;
            padding: 12px;
            overflow-wrap: anywhere;
            background: #102a43;
            border-radius: 4px;
            color: #d9f0ff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            white-space: pre-wrap;
        }

        @media (max-width: 560px) {
            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>POST and Beacon Request Test</h1>
        <p class="hint">
            A POST request and a beacon request are sent automatically when this page loads.
        </p>

        <label for="endpoint">Request endpoint</label>
        <input id="endpoint" type="url" value="http://172.16.41.79:8080/post" placeholder="https://example.test/collect">

        <label for="payload">Beacon payload</label>
        <textarea id="payload">{"event":"request-test","source":"ping-beacon-page"}</textarea>

        <div id="log" role="status" aria-live="polite">Ready.</div>
    </main>

    <script>
        const endpointInput = document.querySelector("#endpoint");
        const payloadInput = document.querySelector("#payload");
        const log = document.querySelector("#log");

        function getEndpoint() {
            return endpointInput.value.trim() || window.location.href;
        }

        function writeLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            log.textContent = `[${timestamp}] ${message}\n${log.textContent}`.trim();
        }

        function sendPostRequest() {
            fetch(getEndpoint(), {
                method: "POST",
                body: payloadInput.value,
                headers: {
                    "Content-Type": "text/plain;charset=UTF-8"
                },
                mode: "no-cors",
                cache: "no-store",
                keepalive: true
            })
                .then(() => writeLog(`POST request dispatched to ${getEndpoint()}.`))
                .catch((error) => writeLog(`POST request failed: ${error.message}`));
        }

        function sendBeaconRequest() {
            if (!navigator.sendBeacon) {
                writeLog("Beacon is not supported by this browser.");
                return;
            }

            const sent = navigator.sendBeacon(
                getEndpoint(),
                new Blob([payloadInput.value], { type: "text/plain;charset=UTF-8" })
            );
            writeLog(`Beacon ${sent ? "queued" : "was not queued"} for ${getEndpoint()}.`);
        }

        sendPostRequest();
        sendBeaconRequest();
    </script>
</body>
</html>
